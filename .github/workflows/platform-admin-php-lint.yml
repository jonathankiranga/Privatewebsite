name: Platform admin PHP syntax

on:
  push:
    paths:
      - 'platform-admin/**/*.php'
      - '.github/workflows/platform-admin-php-lint.yml'
  pull_request:
    paths:
      - 'platform-admin/**/*.php'
      - '.github/workflows/platform-admin-php-lint.yml'

jobs:
  php-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.3']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mysqli
      - name: Check PHP syntax
        run: |
          find platform-admin -type f -name '*.php' -print0 | xargs -0 -n1 php -l
